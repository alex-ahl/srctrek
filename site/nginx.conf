server {
  listen 80;
  root /usr/share/nginx/html;

  # The install script has no extension: served as text, a browser shows it instead of
  # downloading it, and no-cache gets a fixed script to people right away.
  location = /install {
    default_type text/plain;
    add_header Cache-Control "no-cache";
  }

  # Astro puts a content hash in these names, so a changed file is a new name.
  location /_astro/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location / {
    try_files $uri $uri/ =404;
  }
}
