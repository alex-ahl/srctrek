name: Site

on:
  push:
    branches: [master]
    paths: ["site/**", "docs/assets/**", ".github/workflows/site.yml"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run build
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-site:latest
            ghcr.io/${{ github.repository }}-site:${{ github.sha }}
